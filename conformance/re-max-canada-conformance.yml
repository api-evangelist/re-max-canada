sector_context: >-
  RESO conformance in Canada is a board-level phenomenon. The national
  cooperative that actually syndicates listings — CREA, via REALTOR.ca and the
  Data Distribution Facility — appears in RESO as a Class F association member
  rather than as a certified data provider, and only 2 of the 30 observed
  Canadian directory entries carry status "Certified Current". A brokerage brand
  is structurally the wrong tier to look for RESO conformance in either country.
