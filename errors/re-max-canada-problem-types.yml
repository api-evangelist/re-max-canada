generated: '2026-07-26'
method: searched
source: >-
  live anonymous error probes of https://blog.remax.ca/wp-json/ on 2026-07-26;
  every body below is the verbatim response
format: wordpress-rest
rfc9457: false
envelope:
  description: >-
    WordPress REST API error envelope. NOT RFC 9457 Problem Details — the
    response is served as application/json (not application/problem+json) and
    uses WordPress's own three-field shape. The HTTP status is duplicated inside
    data.status.
  media_type: application/json
  fields:
    code: Machine-readable error slug, e.g. rest_no_route.
    message: Human-readable English sentence.
    data.status: HTTP status code, repeated in the body.
    data.params: >-
      Present on rest_invalid_param only — a map of parameter name to the
      constraint that was violated.
    data.details: >-
      Present on rest_invalid_param only — a per-parameter nested error object
      with its own code/message/data.
  example: '{"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
problems:
- code: rest_no_route
  status: 404
  title: No route was found matching the URL and request method.
  cause: >-
    The path does not correspond to a registered route, or the route exists but
    not for the HTTP method used.
  remediation: >-
    Re-read the discovery index at https://blog.remax.ca/wp-json/ (saved to
    openapi/re-max-canada-blog-wp-json-index.json) — it declares all 563 routes
    and the methods each accepts.
  probe: GET https://blog.remax.ca/wp-json/nonexistent/v1/thing
  body: '{"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
- code: rest_post_invalid_page_number
  status: 400
  title: The page number requested is larger than the number of pages available.
  cause: Pagination cursor walked past the last page of the collection.
  remediation: >-
    Read the X-WP-TotalPages response header before paging; stop when the Link
    rel="next" header disappears.
  probe: GET https://blog.remax.ca/wp-json/wp/v2/posts?page=99999
  body: '{"code":"rest_post_invalid_page_number","message":"The page number requested is larger than the number of pages available.","data":{"status":400}}'
- code: rest_invalid_param
  status: 400
  title: 'Invalid parameter(s)'
  cause: >-
    A query parameter failed the schema declared for that route in the discovery
    index (type, enum, or numeric bounds).
  remediation: >-
    On this WordPress VIP install per_page is capped at 10, not the WordPress
    default of 100 — the nested detail returns rest_out_of_bounds with the exact
    range. Honour the declared args in the discovery index.
  nested_code: rest_out_of_bounds
  probe: GET https://blog.remax.ca/wp-json/wp/v2/posts?per_page=9999
  body: '{"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400,"params":{"per_page":"per_page must be between 1 (inclusive) and 10 (inclusive)"},"details":{"per_page":{"code":"rest_out_of_bounds","message":"per_page must be between 1 (inclusive) and 10 (inclusive)","data":null}}}}'
- code: rest_forbidden
  status: 401
  title: Sorry, you are not allowed to do that.
  cause: >-
    The route requires an authenticated WordPress user with a sufficient
    capability and the caller is anonymous.
  remediation: >-
    Most of the 563 routes (Jetpack, Akismet, cron-control, Yoast, Cloudinary,
    WordPress VIP) are staff-only. There is no third-party onboarding path; see
    authentication/re-max-canada-authentication.yml.
  note: >-
    Returns 401 without a WWW-Authenticate header, so no authentication scheme
    is advertised on failure.
  probe: GET https://blog.remax.ca/wp-json/wp/v2/settings
  body: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
- code: rest_post_invalid_id
  status: 404
  title: Invalid post ID.
  cause: The requested resource id does not exist (or is not readable anonymously).
  remediation: List the collection first and use an id returned by it.
  probe: GET https://blog.remax.ca/wp-json/wp/v2/posts/999999999
  body: '{"code":"rest_post_invalid_id","message":"Invalid post ID.","data":{"status":404}}'
caveat: >-
  This catalog describes the stock WordPress REST API on a marketing blog, which
  is the only anonymously callable machine-readable surface RE/MAX Canada
  serves. It is not a RE/MAX product API error reference — none exists, because
  no product API exists. RE/MAX Canada publishes no error documentation of its
  own; every entry here was obtained by probing and is recorded verbatim.
