status_page:
  url: null
  finding: >-
    None. status.remax.ca resolves to a REAL, distinct DNS record — CNAME
    stats.pingdom.com — which is not the remax.ca wildcard target
    (customers.kvcore.com, proven by the control probe). It is nonetheless a
    DANGLING Pingdom public status page: the HTTPS certificate does not cover
    status.remax.ca, and both http://status.remax.ca/ and https://status.remax.ca/
    (with verification disabled) return HTTP 404 with the Pingdom body
    "404 - Status Page not Found" (1,661 bytes). RE/MAX Canada once pointed a
    hostname at a Pingdom status page and the page no longer exists. Because
    there is no live status page, NO `StatusPage` pointer is wired into
    apis.yml.
  evidence:
  - url: https://status.remax.ca/
    dns: CNAME stats.pingdom.com
    status: 404
    tls: certificate subject does not match status.remax.ca
    bytes: 1661
    fetched: '2026-07-26'
  - url: http://status.remax.ca/
    status: 404
    bytes: 1661
    fetched: '2026-07-26'
  - url: https://trust.remax.ca/
    dns: CNAME customers.kvcore.com
