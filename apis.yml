apis:
- aid: re-max-canada:re-max-canada-blog-wordpress-rest-api
  name: RE/MAX Canada Blog WordPress REST API
  description: >-
    The only anonymously reachable, machine-readable API surface found anywhere
    in the RE/MAX Canada estate. blog.remax.ca is a WordPress VIP site (CNAME
    remax-promotions.go-vip.net) that serves the stock WordPress REST API at
    /wp-json/ with no authentication. The discovery index returned HTTP 200 and
    446,832 bytes on 2026-07-26, declaring 25 namespaces and 563 routes, and
    self-documents every route's methods and arguments. It must not be mistaken
    for a RE/MAX product API. It carries Canadian real estate news posts, pages,
    categories, tags, media and authors — no listings, no property records, no
    valuations and no RESO Data Dictionary fields. Most of the 563 routes belong
    to Jetpack, Akismet, cron-control, Yoast, Cloudinary and WordPress VIP
    plugins and require authentication; the anonymously readable surface is the
    wp/v2 content namespace, confirmed with GET /wp-json/wp/v2/posts?per_page=1
    (200) and GET /wp-json/wp/v2/users (200). The declared authentication scheme
    is WordPress application passwords, authorized at
    https://blog.remax.ca/wp-admin/authorize-application.php, which is a staff
    login rather than a developer onboarding path. RE/MAX Canada publishes no
    documentation for it; it is a default of the hosting platform. The identical
    surface is also live on join.remax.ca and franchise.remax.ca.
  humanURL: https://blog.remax.ca/
  baseURL: https://blog.remax.ca/wp-json
