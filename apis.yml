name: RE/MAX Canada
kind: company
description: >-
  RE/MAX Canada is the Canadian arm of RE/MAX, LLC, operating the remax.ca
  consumer portal in English and French and franchising RE/MAX brokerages across
  the country. Since RE/MAX Holdings closed its USD 235 million purchase of the
  RE/MAX INTEGRA North America regions on 2021-07-21, the Ontario-Atlantic and
  Western Canada regions are company-owned regions of RE/MAX, LLC, folded into
  RE/MAX Canada; Quebec is served separately and remax.ca robots.txt explicitly
  disallows /qc and /quebec. Its home market is Canada, and it sits in the value
  chain as a brokerage franchisor and consumer portal operator rather than as a
  data owner. Canadian residential listing content is cooperatively controlled by
  CREA and the member boards through REALTOR.ca and the Data Distribution
  Facility, so RE/MAX Canada displays MLS content it licenses rather than
  publishes; the remax.ca footer carries CREA's MLS trademark notice, and the
  site's home price estimates are supplied by Teranet Inc. under a
  personal-use-only licence that forbids commercial use, resale, external
  distribution and sublicensing even though Teranet's own inputs derive from
  public records collected by the Province of Ontario, the Province of Manitoba
  and the British Columbia Assessment Authority. Its API posture is recorded here
  honestly: there is no developer portal, no published API programme, no
  OpenAPI, Swagger, GraphQL or OData $metadata document, and no RESO Web API or
  Data Dictionary certification — a case-insensitive search of the full RESO
  certification directory returns zero RE/MAX matches, while 30 Canadian boards
  and pooled platforms do appear there. developer.remax.ca, developers.remax.ca
  and docs.remax.ca are wildcard DNS artifacts pointing at the kvCORE platform,
  proven by a control probe; api.remax.ca is a real AWS load balancer that
  301-redirects every path to www.remax.ca; and the remax.ca terms of use
  prohibit crawlers, scripts and other automated devices outright. The only
  anonymously callable machine-readable RE/MAX Canada surface found is the
  default WordPress REST API on its WordPress VIP-hosted blog — content, not
  property data.
