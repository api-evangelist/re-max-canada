harvest:
  openapi:
    harvested: false
    count: 0
    note: >-
      No OpenAPI, Swagger, AsyncAPI, GraphQL schema or OData $metadata document
      exists anywhere in the RE/MAX Canada estate. Every candidate path listed in
      the probe log was tried and returned 404, 301 or 500. Nothing was
      generated, inferred or reconstructed.
  machineReadableContracts:
    harvested: true
    count: 1
    items:
      - path: openapi/re-max-canada-blog-wp-json-index.json
        format: >-
          WordPress REST API discovery index — NOT OpenAPI. It is WordPress's own
          self-describing route document: for each of 563 routes it declares the
          namespace, supported methods, endpoint arguments and their types,
          defaults and enums. It is genuinely machine-readable, and it is saved
          here verbatim precisely because it is the only such document RE/MAX
          Canada serves.
        sourceURL: https://blog.remax.ca/wp-json/
        httpStatus: 200
        fetched: '2026-07-26'
        bytes: 446832
        parsed: true
        namespaces: 25
        routes: 563
        auth: >-
          Anonymous read on wp/v2 content routes; WordPress application passwords
          declared for write/admin routes.
        redactions: none required
        caveat: >-
          Content API only. No listings, no property records, no valuations, no
          RESO fields. Most routes are Jetpack / Akismet / cron-control / Yoast /
          Cloudinary / WordPress VIP plugin routes requiring authentication.
  collections:
    harvested: false
    count: 0
    note: >-
      No Postman workspace, collection or Documenter site was found for RE/MAX
      Canada. (The sibling RE/MAX record has two, but both belong to RE/MAX
      Europe.)

apiFamily:
  segmentationAsTheDocsUseIt: >-
    RE/MAX Canada publishes no API documentation, so there is no vendor
    segmentation to represent. The product categories the SITE exposes — for
    sale, for rent, agents, offices, neighbourhoods, open houses, land, condo,
    mobile homes, townhomes, business opportunities, off-market, and Teranet
    price estimates — are web pages, not API resources.
  listingsSearch: no API
  propertyRecords: no API
  valuationAVM: >-
    Present as a consumer FEATURE only. Home price estimates on remax.ca are
    supplied by Teranet Inc. under a personal-use-only licence (terms of use
    section 4). No API, no endpoint, no key. Commercial use, resale, external
    distribution and sublicensing are all forbidden.
  titleAndLandRegistry: >-
    No API. Relevant only through the Teranet relationship — Teranet operates
    Ontario's land registry under concession and appears in the remax.ca terms of
    use as both a named business partner and the source of price estimates
    derived from Ontario, Manitoba and BC Assessment public records.
  transactions: no API
  documents: no API
  tenancy: >-
    Rentals exist as a portal section with its own sitemap
    (rental_sitemaps_index.xml). No API.
  payments: no API
  mortgage: >-
    No Canadian equivalent of the US Motto Mortgage / wemlo developer surface was
    found, and neither of those publishes one either.
  webhooks: none documented
  events: none documented
  asyncapi: none
  graphql: >-
    None. https://api.remax.ca/graphql returns 301 to www.remax.ca; no GraphQL
    endpoint or introspection surface was found.
  sdks: none published
  cli: none published
  postman: none
  changelog: none published
  statusPage: none found
  ratePlans: none published
  rateLimits: none documented

conclusions:
  developerPortal: ''
  portalConfirmed: false
  gated: true
  gatedNote: >-
    "Gated" here does not mean there is a gate a developer can queue at. There is
    no gate because there is no programme. The listing data RE/MAX Canada
    displays is gated one layer up, at CREA and the member boards, and the site's
    own terms of use place an explicit prohibition on automated access.
  accessGate: none-published
  openData: false
  resoCertified: false
  resoPosture: >-
    No RESO reference found — not certified, not in the RESO certification
    directory, no Web API or Data Dictionary endorsement, no $metadata, no OData,
    no UPI. RESO in Canada appears only at board and pooled-platform level (30
    Canadian entries in the directory, only 2 of them "Certified Current"), with
    CREA participating as a Class F association member rather than as a certified
    data provider.
  sectorLesson: >-
    Canada answers the sector's central question by removing the mandate. The
    United States has ~500 MLSs each obliged by NAR to hold RESO certification,
    which produces hundreds of certified-but-unreachable endpoints; Canada has one
    national cooperative and voluntary board-level certification, which produces
    fewer certified endpoints and the same unreachability. Either way the
    brokerage brand holds nothing. RE/MAX Canada's estate is a WAF-fronted
    consumer portal, a wildcard that makes three non-existent developer hostnames
    answer on port 443, an api. subdomain that 301s every request back to the
    website, and a marketing blog whose stock WordPress REST API is the only
    thing in the whole company that a developer can call anonymously. The most
    revealing artifact is the split posture: blog.remax.ca/robots.txt explicitly
    welcomes GPTBot, ClaudeBot, PerplexityBot and CCBot to the marketing content,
    while the terms of use governing the listings portal forbid crawlers, scripts
    and automated devices entirely. The content RE/MAX Canada owns is wide open
    to agents; the data it merely licenses is closed to everyone.

