aid: re-max-canada
name: RE/MAX Canada
slug: re-max-canada
reviewer: API Evangelist
reviewed: '2026-07-26'
sector: Real Estate
tier: brokerage
homeMarket: Canada
primaryDomain: remax.ca

review:
  question: >-
    Does RE/MAX Canada publish a real, reachable, machine-readable API surface —
    and is it RESO-certified, RESO-adjacent, or neither?
  answer: >-
    No. RE/MAX Canada publishes no developer portal, no API programme, no
    OpenAPI/Swagger/GraphQL/AsyncAPI document and no OData $metadata. It holds no
    RESO certification of any kind and no RESO reference appears anywhere in its
    published estate. The only anonymously callable machine-readable surface
    found is the stock WordPress REST API on its WordPress VIP-hosted blog, which
    carries news content and no property data. Canadian listing content reaches
    remax.ca through the CREA / member-board cooperative rather than through
    anything RE/MAX Canada publishes, and the site's terms of use prohibit
    automated access outright.

identity:
  legalRelationship: >-
    Canadian operating arm of RE/MAX, LLC (subsidiary of RE/MAX Holdings, Inc.,
    NYSE: RMAX, Denver, Colorado). On 2021-06-03 RE/MAX, LLC agreed to acquire
    the North America regions of RE/MAX INTEGRA for approximately USD 235 million
    in cash; the purchase closed 2021-07-21, bringing the RE/MAX Ontario-Atlantic
    Canada region (Ontario, New Brunswick, Newfoundland and Labrador, Nova
    Scotia, Prince Edward Island) plus the Western Canada region and roughly
    12,000 Canadian agents into RE/MAX, LLC company-owned regions. In Canada the
    acquired regions were folded into RE/MAX Canada.
    Sources: RE/MAX Holdings press releases at news.remax.com and the SEC EDGAR
    exhibit for CIK 0001581091 (tm2122783d1_ex99-1.htm).
  quebecCarveOut: >-
    Quebec is handled separately from remax.ca. https://www.remax.ca/robots.txt
    (HTTP 200, fetched 2026-07-26) explicitly disallows /qc, /qc/*, /quebec and
    /quebec/* for all user agents, and https://www.remax-quebec.com/ is a live
    separate property (HTTP 200). Recorded as an observed fact about the portal's
    coverage, not a claim about corporate ownership.
  model: >-
    Brokerage franchisor and bilingual consumer portal operator. RE/MAX Canada
    does not own the listing data remax.ca displays; that content originates with
    REALTOR® members and their boards under the CREA cooperative.
  parentProfile: >-
    See the sibling repo all/re-max/ for RE/MAX Holdings (United States), whose
    only documented API programme lives in RE/MAX Europe and is partner-only.

# =====================================================================
# THE POINT OF THE EXERCISE: RESO POSTURE vs ACCESS GATE vs OPEN DATA
# Three separate facts. None of them implies another.
# =====================================================================
resoAndAccess:

  resoPosture:
    summary: >-
      No RESO reference found. RE/MAX Canada is not RESO-certified, is not named
      in the RESO certification directory, and publishes no Web API, no OData
      $metadata and no Universal Property Identifier. RESO in Canada is a
      board-level phenomenon, not a brokerage-level one.
    certified: false
    webApiCertification: none
    dataDictionaryCertification: none
    dataDictionaryVersion: null
    uoi: null
    metadataDocument: none
    odataSurface: >-
      None. https://api.remax.ca/$metadata, https://api.remax.ca/odata and
      https://api.remax.ca/Reso all returned HTTP 301 to www.remax.ca (the host
      redirects every path); https://www.remax.ca/$metadata returned HTTP 404.
      No OData service document, service root or $metadata EDMX exists.
    universalPropertyIdentifier: >-
      No UPI reference found. Zero occurrences of "UPI" or "Universal Property
      Identifier" in the remax.ca homepage document (339,385 bytes, fetched
      2026-07-26) or in the harvested WordPress REST index.
    resoStringsOnRemaxCa: >-
      A case-insensitive grep of the remax.ca homepage returns 11 apparent
      "reso" matches — ALL of them false positives from the words "RESOURCES",
      "Resort" and "Hotel/Resort" in the property-category vocabulary. Manually
      inspected on 2026-07-26; there is no RESO reference on remax.ca.
    certificationDirectoryEvidence:
      - url: https://www.reso.org/certificates/
        httpStatus: 200
        fetched: '2026-07-26'
        bytes: 416233
        finding: >-
          The RESO certification directory enumerates 578 organization entries,
          each with a UOI, a date and a status (Certified Current / Passed
          Current / Certified Legacy / Uncertified). A case-insensitive regex
          for "re ?/? ?max" over the full document returns ZERO matches. RE/MAX
          Canada is absent, as is every other RE/MAX entity.
        canadianEntriesPresent: 30
        canadianEntriesNote: >-
          Canada IS represented in the directory — but only at board, association
          and pooled-platform level, never at brokerage level. Observed Canadian
          entries include: Information Technology Systems Ontario (ITSO) UOI
          M00000807, 2022-03-23, Passed Current; Pillar 9 UOI M00000674,
          2025-03-09, Passed Current; REALTORS® Association of Edmonton UOI
          M00000692, 2025-03-10, Passed Current; Nova Scotia Association of
          REALTORS® UOI M00000699, 2022-08-15, Passed Current; Vancouver Island
          Real Estate Board UOI M00000576, 2025-03-09, Passed Current; Victoria
          Real Estate Board UOI M00000051, 2022-08-15, Passed Current; Grand
          Forks Area Association of REALTORS® UOI M00000429, 2020-01-31,
          Certified Current; Huron Board of REALTORS® UOI M00000816, 2023-03-06,
          Certified Current. Toronto Regional Real Estate Board (UOI M00000527,
          2025-03-09), Greater Vancouver REALTORS® (UOI M00000671, 2024-02-12),
          Fraser Valley Real Estate Board (UOI M00000607), Ottawa Real Estate
          Board (UOI M00000401), Saskatchewan REALTORS® Association (UOI
          M00000698), Winnipeg Regional Real Estate Board (UOI M00000647), New
          Brunswick Real Estate Board (UOI M00000124) and Newfoundland &
          Labrador Association of REALTORS® (UOI M00000639) are all listed with
          status Uncertified. Only two of the thirty Canadian entries observed
          carry status "Certified Current".
      - url: https://certification.reso.org/
        httpStatus: 400
        fetched: '2026-07-26'
        finding: >-
          Consistent with the sibling RE/MAX review, the live RESO certification
          reporting system rejects an anonymous GET and serves no body.
    membershipEvidence:
      - url: https://www.reso.org/membership/
        httpStatus: 200
        fetched: '2026-07-26'
        bytes: 171436
        finding: >-
          "RE/MAX" appears exactly once, in the "Brokers, Agents and Appraisers
          (Class D Members)" list. That entry is the RE/MAX corporate brand
          (RE/MAX Holdings), not RE/MAX Canada, and it is a membership list, not
          a certification list. The Canadian Real Estate Association (CREA)
          appears separately under "Other Associations or Groups (Class F
          Members)" — the Canadian national cooperative sits in RESO as an
          association member, not as a certified data provider.
    interpretation: >-
      Canada shows the certification-versus-reachability split from the other
      side. In the United States, RESO certification is mandated by NAR and held
      by the ~500 MLSs; in Canada the same standard exists but is voluntary and
      board-by-board, and the national cooperative that actually syndicates the
      listings — CREA, through REALTOR.ca and the Data Distribution Facility —
      participates in RESO as an association member rather than as a certified
      endpoint. RE/MAX Canada, the brokerage brand, is downstream of all of it
      and holds nothing. A brokerage-tier organization is structurally the wrong
      place to look for a RESO endpoint in either country.

  accessGate:
    value: none-published
    whatADeveloperMustSignOrJoin: >-
      Nothing, because there is nothing to sign or join. RE/MAX Canada operates
      no developer programme, publishes no API terms, no key-request form, no
      application flow, no pricing and no rate-limit documentation. There is no
      partner API, no IDX feed offered by RE/MAX Canada itself, and no sandbox.
      A developer who wants Canadian MLS listing data must go to the layer above
      RE/MAX Canada: CREA's Data Distribution Facility (DDF®), which requires a
      REALTOR® membership relationship and a signed data licence, or a member
      board / board technology provider such as ITSO or Pillar 9 — none of which
      RE/MAX Canada controls or resells. Going the other direction is expressly
      forbidden: the remax.ca terms of use prohibit "moyens électroniques,
      automatisés ou à haut volume (notamment des robots d'exploration ou autres,
      des scripts ou d'autres dispositifs automatisés) pour accéder aux
      services" — automated, electronic or high-volume means, including web
      crawlers, scripts or other automated devices, to access the services — and
      separately forbid any search or retrieval application designed to retrieve,
      index or reproduce the site. https://www.remax.ca/robots.txt disallows
      /api/, /v2/ and /feature-flags/ to all user agents.
    selfServe: false
    publicDocsReadableAnonymously: false
    keysObtainableAnonymously: false
    developerPortal: none
    developerPortalCaveat: >-
      developer.remax.ca, developers.remax.ca and docs.remax.ca all answer on
      port 443 with HTTP 403, which could be mistaken for a gated portal. They
      are not portals. remax.ca serves a DNS WILDCARD: the control probe
      zzzznotreal.remax.ca resolves to exactly the same target
      (CNAME customers.kvcore.com, behind Cloudflare) as all three. The 403 is a
      Cloudflare challenge for a site that does not exist. Same wildcard pattern
      as remax.com in the sibling repo.

  openData:
    value: false
    finding: >-
      RE/MAX Canada publishes no open, unlicensed, publicly callable dataset.
      This is the sharpest illustration in the Canadian market of public record
      turned commercial product. Section 4 of the remax.ca terms of use governs
      the site's price estimates, which are supplied by Teranet Inc. — the
      company that operates Ontario's land registry under a long concession. The
      terms state that the estimates may be used only for personal, non-business
      property evaluation and expressly "ne peuvent pas être utilisées à des fins
      commerciales, de vente, de distribution externe ou d'octroi de licence ou
      de sous-licence, moyennant des frais ou non" (may not be used for
      commercial purposes, sale, external distribution, or licensing or
      sublicensing, whether for a fee or not) — while simultaneously conceding
      that "certaines des évaluations de prix, ou l'ensemble d'entre elles,
      peuvent être basées sur des renseignements provenant du public et recueillis
      par la province de l'Ontario, la province du Manitoba et par la British
      Columbia Assessment Authority" (some or all of the price estimates may be
      based on public information collected by the Province of Ontario, the
      Province of Manitoba, and the British Columbia Assessment Authority). Public
      provincial assessment and registry data reaches the consumer only through a
      private intermediary, under a personal-use-only licence. That is the
      Canadian privatised-land-registry seam in a single clause.
    thirdPartyOpenDataNote: >-
      Open Canadian property data does exist, but not from RE/MAX Canada — it
      exists at provincial/municipal open-data portals and is out of scope for
      this provider record. Nothing was claimed here that was not fetched.

  authModel:
    productApiAuth: none — no product API exists to authenticate against.
    onlyObservedScheme: >-
      WordPress application passwords, declared in the harvested
      https://blog.remax.ca/wp-json/ index as
      {"application-passwords":{"endpoints":{"authorization":
      "https://blog.remax.ca/wp-admin/authorize-application.php"}}}. This is a
      CMS staff-login mechanism on a WordPress VIP site, not developer
      onboarding. The wp/v2 content routes read anonymously with no credential.
    openidConnectDiscovery: >-
      Not served. https://www.remax.ca/.well-known/openid-configuration returned
      HTTP 404 (anonymous GET, 2026-07-26). No OIDC, no OAuth authorization
      server metadata, no SAML metadata found on any RE/MAX Canada host.
    apiKeys: none documented
    oauth2: none documented
    mtls: none documented
    scopes: >-
      None. No scope vocabulary exists to record; none was invented.

