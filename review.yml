  subdomainProbes:
    method: >-
      Every candidate hostname was compared against the wildcard control probe
      zzzznotreal.remax.ca, which resolves to CNAME customers.kvcore.com. Any
      host resolving to that target is a wildcard artifact, not a real service.
      Only hosts whose DNS DIFFERS from the wildcard are treated as real.
    wildcardTarget: customers.kvcore.com
    hosts:
      - url: https://developer.remax.ca/
        status: 403
        dns: CNAME customers.kvcore.com
        verdict: WILDCARD — not a portal
